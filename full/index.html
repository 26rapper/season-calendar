<title>제철 검색 달력 — 비공개판</title>
<style>
:root { --bg: #f6f4ee; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d6cc; --card: #ffffff; --accent: #1f3a2c; --warn: #8a5a1a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #141513; --fg: #ecebe6; --muted: #a2a29b; --line: #33352f; --card: #1d1f1b; --accent: #b7c9b0; --warn: #e0a84a; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
body { min-height: 100svh; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); padding-block: 24px; }
.card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px 18px; }
h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.5; }
label.f { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
input[type=password] { width: 100%; font: inherit; font-size: 16px; padding: 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--fg); }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 0; flex-wrap: wrap; }
.remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
button { font: inherit; font-size: 15px; padding: 11px 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; }
button[disabled] { opacity: .6; cursor: progress; }
.err { color: var(--warn); font-size: 13px; margin: 10px 0 0; min-height: 1.2em; }
.foot { font-size: 11px; color: var(--muted); margin: 16px 0 0; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>제철 검색 달력 — 비공개판</h1>

  <label class="f" for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" inputmode="text" autocapitalize="off" spellcheck="false" required>
  <div class="row">
    <label class="remember"><input type="checkbox" id="keep"> 이 기기에서 기억</label>
    <button type="submit" id="go">열기</button>
  </div>
  <div class="err" id="err" aria-live="polite"></div>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const KEEP = 'season-calendar-full-key';
async function keyFromPass(pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, km,
                                 { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function show(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function tryStored() {
  let raw = null;
  try { raw = localStorage.getItem(KEEP); } catch (e) { raw = null; }
  if (!raw) return false;
  try {
    const key = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, true, ['decrypt']);
    await show(key); return true;
  } catch (e) { try { localStorage.removeItem(KEEP); } catch (_) {} return false; }
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '푸는 중…';
  try {
    const key = await keyFromPass(document.getElementById('pw').value);
    if (document.getElementById('keep').checked) {
      try { localStorage.setItem(KEEP, toB64(await crypto.subtle.exportKey('raw', key))); } catch (e) {}
    }
    await show(key);
  } catch (e) {
    err.textContent = (!window.crypto || !window.crypto.subtle) ? '이 주소에서는 풀 수 없어요 — https 주소(…/full/)에서 열어 주세요.' : '비밀번호가 맞지 않아요.'; go.disabled = false;
    document.getElementById('pw').select();
  }
});
tryStored();
