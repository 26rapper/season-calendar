<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제철 검색 달력</title>


<style>
/* 짜임(폰 먼저): 해 고르기 → 달 띠(절기 · 그 달 한창 n) → 달 머리 → 네 갈래 → 품목 카드(이름 · n위 · 12달 작은 그림 · 한 줄) → 누르면 그 해 흐름 · 네 해 겹쳐 보기 · 올릴 때 · 공급처
   모습은 운영 대시보드(엔진 33 · 2026-11-22 승인)와 같은 말투: 따뜻한 회백 바탕 · 흰 면 · 가는 선과 여백으로 나눔 · 그림자 0 · 꾸미는 움직임 0.
   글꼴은 고딕 한 벌(대시보드와 같은 벌), 층은 굵기 · 크기로만. 색은 역할로만 — 한창 = 딥그린 · 올리면 좋아요(곧 뜰 것) = 앰버 · 아직 팔려요(막바지) = 네이비 ·
   철 아님 = 옅은 회색 · 고른 달 = 차콜 · 막대 기본 = 옅은 네이비 그레이 · 경고 = 레드. 변수 이름은 그대로(가린 공개판 CSS · JS 인라인 색이 기댐). */
:root {
  --bg: #F6F5F1; --panel: #FFFFFF; --ink: #1E2124; --muted: #5E636B; --ink3: #8A8F98; --line: #E7E5DF; --line-2: #D9D6CE; --soft: #EFEEE9; --soft-2: #FBFAF8;
  --prep: #9A6200; --prep-soft: #F7EEDB; --peak: #0E5A3C; --peak-soft: #E8F1EC; --sell: #1F3A5F; --sell-soft: #E9EEF5; --rest: #8A8F98; --rest-soft: #EFEEE9;
  --bar: #B7C2D0; --warn: #A33A2E; --warn-soft: #F6E7E4; --link: #1F3A5F; --shadow: none;
  --font: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141517; --panel: #1B1D20; --ink: #ECEAE4; --muted: #A7ABB2; --ink3: #7E838B; --line: #2A2D31; --line-2: #3A3D42; --soft: #24272B; --soft-2: #202326;
  --prep: #D9A24A; --prep-soft: #2E2513; --peak: #5DB88C; --peak-soft: #15291F; --sell: #8FA9CB; --sell-soft: #1A2433; --rest: #6F747C; --rest-soft: #26292D;
  --bar: #4A5566; --warn: #E07A6C; --warn-soft: #33201D; --link: #8FA9CB; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141517; --panel: #1B1D20; --ink: #ECEAE4; --muted: #A7ABB2; --ink3: #7E838B; --line: #2A2D31; --line-2: #3A3D42; --soft: #24272B; --soft-2: #202326;
  --prep: #D9A24A; --prep-soft: #2E2513; --peak: #5DB88C; --peak-soft: #15291F; --sell: #8FA9CB; --sell-soft: #1A2433; --rest: #6F747C; --rest-soft: #26292D;
  --bar: #4A5566; --warn: #E07A6C; --warn-soft: #33201D; --link: #8FA9CB; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.6; margin: 0; letter-spacing: -0.005em;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px;
  font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 680px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
button:focus-visible, .card:focus-visible, .ghost:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* 머리: 제목 · 한 줄 설명 · 해(밑줄 탭) · 달 띠 */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line-2); }
.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.025em; line-height: 1.3; }
.ghost { margin-left: auto; font-size: 12px; font-weight: 600; line-height: 1.4; padding: 5px 10px; border: 1px solid var(--line-2); background: var(--panel); color: var(--muted); border-radius: 6px; text-decoration: none; white-space: nowrap; }
.ghost[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.top .who { margin: 0 0 10px; font-size: 12.5px; color: var(--ink3); }
.years { display: grid; grid-template-columns: repeat(var(--ny, 4), 1fr); gap: 0; border-bottom: 1px solid var(--line); }
.years button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; font-weight: 600; font-size: 14px; padding: 6px 0 8px; color: var(--ink3); line-height: 1.2; border-radius: 0; }
.years button small { display: block; font-size: 10.5px; font-weight: 500; margin-top: 2px; }
.years button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.months { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 14px 0 12px; scroll-snap-type: x proximity; }
.months::-webkit-scrollbar { display: none; }
.mo { flex: 0 0 auto; width: 62px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 9px 4px 8px; text-align: center; scroll-snap-align: center; position: relative; }
.mo b { display: block; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.mo b small { font-size: 11px; font-weight: 500; margin-left: 1px; color: var(--ink3); letter-spacing: 0; }
.mo .jg { display: block; font-size: 10px; color: var(--ink3); margin-top: 5px; line-height: 1.2; }
.mo .cnt { display: block; font-size: 10.5px; margin-top: 4px; color: var(--peak); font-weight: 600; line-height: 1.2; }
.mo .tag { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 9.5px; font-weight: 600; line-height: 1.45; padding: 1px 6px; border-radius: 4px; background: var(--link); color: var(--panel); white-space: nowrap; }
.mo.fill { border-style: dashed; border-color: var(--line-2); } .mo.fill .tag { background: var(--panel); color: var(--muted); border: 1px solid var(--line-2); }
.mo[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mo[aria-pressed="true"] b small, .mo[aria-pressed="true"] .jg, .mo[aria-pressed="true"] .cnt { color: inherit; opacity: .78; }

/* 보는 법 · 달 머리(굵은 제목 + 옅은 한 줄) · 알림(왼쪽 앰버 선) */
.help { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; font-size: 13px; color: var(--muted); margin: 16px 0 0; }
.help.on { display: block; } .help p { margin: 0 0 8px; } .help p:last-child { margin: 0; } .help b { font-weight: 600; color: var(--ink); }
.help i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.head { padding: 24px 0 4px; }
.head h2 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -.025em; line-height: 1.2; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.head h2 small { font-size: 13px; font-weight: 500; color: var(--ink3); letter-spacing: 0; }
.head .sub { font-size: 12.5px; color: var(--ink3); margin: 6px 0 0; }
.notice { position: relative; margin-top: 14px; font-size: 13px; padding: 10px 14px 10px 16px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.notice::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: var(--prep); }
.notice b { font-weight: 600; color: var(--ink); }

/* 갈래 탭(밑줄 · 작은 색 점 + 글자 + 개수) */
.tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 18px 0 0; padding: 0; border-bottom: 1px solid var(--line-2); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; border-radius: 0; padding: 10px 0; font-size: 13.5px; font-weight: 600; line-height: 1.2; color: var(--muted); white-space: nowrap; }
.tabs button i { width: 6px; height: 6px; border-radius: 50%; background: var(--rest); flex: 0 0 auto; }
.tabs button.key i, .tabs button.prep i { background: var(--prep); } .tabs button.peak i { background: var(--peak); } .tabs button.sell i { background: var(--sell); } .tabs button.rank i { background: var(--ink); }
.tabs button b { font-weight: 500; font-size: 12px; color: var(--ink3); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button[aria-pressed="true"] b { color: var(--muted); }
.how { font-size: 12.5px; color: var(--ink3); margin: 12px 0 14px; } .how b { color: var(--ink); font-weight: 600; }

/* 품목 카드: 흰 면 + 가는 선, 안쪽은 선과 여백으로만 */
.list { display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 14px; min-width: 0; cursor: pointer; }
.card:hover, .card.open { border-color: var(--line-2); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.name { font-size: 16px; font-weight: 700; letter-spacing: -.015em; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; line-height: 1.4; color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); flex: 0 0 auto; }
.chip.warn { color: var(--warn); } .chip.warn::before { background: var(--warn); }
.chip.prep { color: var(--prep); } .chip.prep::before { background: var(--prep); } .chip.peak { color: var(--peak); } .chip.peak::before { background: var(--peak); }
.chip.sell { color: var(--sell); } .chip.sell::before { background: var(--sell); } .chip.rest { color: var(--rest); } .chip.rest::before { background: var(--rest); }
.say .chip { margin-left: 4px; vertical-align: 0; }
.row .rank { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--ink3); white-space: nowrap; }  /* 카드 오른쪽 순위만 — '이 달 순위' 문장(.say.rank)엔 안 걸리게(폰 폭 넘침, 11-08) */
.row .rank b { color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-left: 2px; }
.mini, .bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; height: 36px; margin: 12px 0 0; }
.bars { height: 84px; margin-top: 18px; }
.mini i, .bars i { display: block; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
.mini i.pk, .bars i.pk { background: var(--peak); }
.mini i.sel, .bars i.sel { background: var(--ink); }
.mini i.pk.sel, .bars i.pk.sel { background: var(--peak); box-shadow: inset 0 0 0 2px var(--ink); }
.mini i.fill, .bars i.fill { opacity: .55; background-image: repeating-linear-gradient(135deg, transparent 0 2px, var(--panel) 2px 4px); }
.bars i .v { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; color: var(--ink); white-space: nowrap; padding-bottom: 2px; }
.ax { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; font-size: 10px; color: var(--ink3); text-align: center; margin-top: 4px; line-height: 1.2; }
.ax span.sel { color: var(--ink); font-weight: 700; } .ax span.pk { color: var(--peak); font-weight: 700; }
.season { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 4px; margin: 6px 0 0; }
.season i { display: block; border-radius: 2px; background: var(--soft); } .season i.on { background: var(--sell); }
.say { font-size: 13.5px; margin: 10px 0 0; } .say b { font-weight: 600; }
.say.prep b, .say.key b { color: var(--prep); } .say.peak b { color: var(--peak); } .say.sell b { color: var(--sell); }
.more { font-size: 12px; font-weight: 600; color: var(--link); margin-top: 8px; }
.detail { display: none; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; }
.card.open .detail { display: block; }
.detail h3 { font-size: 13px; margin: 22px 0 6px; font-weight: 700; letter-spacing: -.01em; } .detail h3:first-child { margin-top: 0; }
.detail h3 small { color: var(--ink3); font-weight: 400; font-size: 12px; letter-spacing: 0; }
div.key { font-size: 11.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
div.key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; background: var(--bar); }
div.key i.fill { opacity: .55; background-image: repeating-linear-gradient(135deg, transparent 0 2px, var(--panel) 2px 4px); }
svg.yrs { width: 100%; height: auto; display: block; margin-top: 6px; }
svg.yrs .grid { stroke: var(--line); stroke-width: 1; }
svg.yrs .ln { fill: none; stroke: var(--link); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
svg.yrs .ln.o3 { opacity: .2; } svg.yrs .ln.o2 { opacity: .34; } svg.yrs .ln.o1 { opacity: .52; } svg.yrs .ln.o0 { opacity: .7; }
svg.yrs .ln.sel { stroke: var(--peak); stroke-width: 2.6; opacity: 1; }
svg.yrs .dot { fill: var(--peak); } svg.yrs .dot.ring { fill: var(--panel); stroke: var(--peak); stroke-width: 2; }
svg.yrs text { fill: var(--ink3); font-size: 10px; font-family: var(--font); }
svg.yrs text.sel { fill: var(--ink); font-weight: 700; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.legend button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.legend button i { width: 14px; height: 0; border-top: 2px solid var(--link); display: inline-block; }
.legend button.o3 i { opacity: .2; } .legend button.o2 i { opacity: .34; } .legend button.o1 i { opacity: .52; } .legend button.o0 i { opacity: .7; }
.legend button[aria-pressed="true"] { color: var(--ink); border-color: var(--line-2); font-weight: 600; } .legend button[aria-pressed="true"] i { border-color: var(--peak); opacity: 1; border-top-width: 3px; }
table.yt { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
table.yt th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 0 8px 6px 0; border-bottom: 1px solid var(--line); }
table.yt td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.yt tr.sel td { font-weight: 600; } table.yt td.num, table.yt th.num { text-align: right; padding-right: 0; }
table.yt td small { color: var(--ink3); font-weight: 400; }
.detail dl { display: grid; grid-template-columns: 6.5em 1fr; gap: 7px 12px; margin: 0; }
.detail dt { color: var(--ink3); } .detail dd { margin: 0; min-width: 0; }
.empty { font-size: 13px; color: var(--ink3); padding: 14px 0; }
footer { margin-top: 40px; font-size: 12px; color: var(--ink3); border-top: 1px solid var(--line-2); padding-top: 16px; }
footer p { margin: 0 0 6px; max-width: 72ch; }
.say.sofar { color: var(--ink3); font-size: 12px; margin-top: 2px; }
@media (min-width: 560px) { .mo { width: 72px; } .mini { height: 40px; } }
/* PC 폭: 대시보드처럼 넓게 — 달 띠는 열두 칸 한 줄, 품목 카드는 두 칸(펼친 카드는 제 칸에서 길어짐 · 차례 그대로) */
@media (min-width: 1000px) {
  body { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1152px; }
  header.top { padding-top: 22px; }
  h1 { font-size: 24px; }
  .top .who { font-size: 13px; }
  .years { max-width: 560px; }
  .months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; overflow: visible; padding-top: 16px; }
  .mo { width: auto; }
  .head { padding-top: 30px; }
  .head h2 { font-size: 30px; }
  .tabs { gap: 26px; }
  .list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .card { padding: 18px 20px 16px; }
  .help { columns: 2; column-gap: 40px; } .help p { break-inside: avoid; }
}
.mz { filter: blur(3px); user-select: none; -webkit-user-select: none; opacity: .85; }
.top .masknote { margin: -2px 0 8px; font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 8px; padding: 4px 9px; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar"><h1>제철 검색 달력</h1><a class="ghost" href="items.html">품목 안내</a><button type="button" class="ghost" id="helpBtn" aria-expanded="false">보는 법</button></div>
  <p class="who">농수산물을 파는 사람이 무엇을 언제 올릴지 보는 달력이에요. 네이버에서 달마다 얼마나 찾는지(2023년부터)로 봐요.</p>
  <p class="masknote">미리보기 쪽이에요 — 품목 이름과 숫자는 가려 두었어요. 짜임새만 보는 쪽이에요.</p>
  <div class="years" id="years" role="tablist" aria-label="해 고르기"></div>
  <div class="months" id="months" role="tablist" aria-label="달 고르기"></div>
</header>
<section class="help" id="help"></section>
<section class="head" id="head"></section>
<div class="tabs" id="tabs"></div>
<p class="how" id="how"></p>
<div class="list" id="list"></div>
<footer id="foot"></footer>
