function barsHtml(pr, m, big) {

    const cls = (k === pr.pm ? 'pk ' : '') + (k === m ? 'sel ' : '') + (pr.fill[k - 1] ? 'fill' : '');
    const label = big && (k === pr.pm || k === m) ? '<span class="v">' + fmt(v) + '</span>' : '';
    return '<i class="' + cls.trim() + '" style="height:' + h + '%" title="' + k + '월 ' + fmt(v) + (pr.fill[k - 1] ? ' (작년 값)' : '') + '">' + label + '</i>'; }).join('');
  const ax = CAL.map(k => '<span class="' + (k === m ? 'sel ' : '') + (k === pr.pm ? 'pk' : '') + '">' + k + '</span>').join('');
  return '<div class="' + (big ? 'bars' : 'mini') + '" aria-hidden="true">' + bars + '</div><div class="ax" aria-hidden="true">' + ax + '</div>';

function yearsSvg(item) {

  let max = 1; YEARS.forEach(y => (item.years[y] || []).forEach(v => { if (v != null && v > max) max = v; }));
  const X = i => L + i * span, Y = v => T + (1 - v / max) * (H - T - B);
  const grid = [0.5, 1].map(f => '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(max * f).toFixed(1) + '" y2="' + Y(max * f).toFixed(1) + '"/>').join('');
  const lines = YEARS.map((y, idx) => { const raw = item.years[y] || []; const segs = []; let cur = [];
    raw.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(X(i).toFixed(1) + ',' + Y(v).toFixed(1)); }); if (cur.length) segs.push(cur);
    const age = YEARS.length - 1 - idx; const cls = 'ln ' + (y === year ? 'sel' : 'o' + Math.min(age, 3));
    return segs.map(s => '<polyline class="' + cls + '" points="' + s.join(' ') + '"/>').join(''); }).join('');
  const pr = profile(item, year); const raw = item.years[year] || [];

  const ax = CAL.map((k, i) => '<text x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle" class="' + (k === month ? 'sel' : '') + '">' + k + '</text>').join('');
  return '<svg class="yrs" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + item.name + ' 해마다 달별 찾는 양">' + grid + lines + dots + ax + '</svg>';

function yearsTable(item) {
  const rows = YEARS.map(y => { const raw = item.years[y] || []; let p = 0, pm = 0; raw.forEach((v, i) => { if (v != null && v > p) { p = v; pm = i + 1; } });
    const prev = item.years[y - 1]; const base = prev && pm ? prev[pm - 1] : null; const cmp = base ? pct(p, base) : null;
    const n = raw.filter(v => v != null).length;
    return '<tr class="' + (y === year ? 'sel' : '') + '"><td>' + y + (n < 12 ? '<small> · ' + n + '월까지</small>' : '') + '</td><td>' + (pm ? pm + '월' : '—') + '</td><td class="num">' + fmt(p) + '</td><td class="num">' + (cmp == null ? '—' : cmp + '%') + '</td></tr>'; }).join('');
  return '<table class="yt"><thead><tr><th>해</th><th>제일 많이 찾은 달</th><th class="num">찾는 양</th><th class="num">한 해 전 같은 달보다</th></tr></thead><tbody>' + rows + '</tbody></table>';

function legendHtml() {
  return '<div class="legend">' + YEARS.map((y, idx) => { const age = YEARS.length - 1 - idx;
    return '<button type="button" data-y="' + y + '" class="o' + Math.min(age, 3) + '" aria-pressed="' + (y === year) + '"><i></i>' + y + '</button>'; }).join('') + '</div>';

function privateBlock() { return ''; }
function privateFoot() { return ''; }
function helpLast() { return '품목을 누르면 그 해 흐름 · 네 해 겹쳐 보기 · 올릴 때가 나와요.'; }
function card(item, pr, m, st) {

  const d = document.createElement('article'); d.className = 'card' + (open ? ' open' : ''); d.tabIndex = 0;

    barsHtml(pr, m, false) +
    '<p class="say ' + st + '">' + say(item, pr, m, st) + '</p>' +
    '<div class="more">' + (open ? '접기 ▴' : '누르면 ' + year + '년 흐름 · 네 해 겹쳐 보기 · 올릴 때 ▾') + '</div>' +
    (open ? '<div class="detail">' +
      '<h3>' + year + '년 흐름 <small>제일 많이 찾은 달 <b>' + pr.pm + '월</b>(' + fmt(pr.p) + ') · 철 ' + (ss.length === 12 ? '연중' : (ss.length ? ss.join('·') + '월' : '없음')) + '(' + ss.length + '달)' + (pr.partial ? ' · 빗금은 작년 값으로 채운 달' : '') + '</small></h3>' +
      barsHtml(pr, m, true) + '<div class="season" aria-hidden="true">' + CAL.map(k => '<i class="' + (ss.includes(k) ? 'on' : '') + '"></i>').join('') + '</div>' +
      '<div class="key"><span><i style="background:var(--peak)"></i>제일 많이 찾은 달</span><span><i style="background:var(--ink)"></i>고른 달</span><span><i style="background:var(--sell)"></i>철(절반 넘게 찾는 달)</span>' + (pr.partial ? '<span><i class="fill"></i>작년 값으로 채움</span>' : '') + '</div>' +
      '<h3>네 해 겹쳐 보기 <small>굵은 선이 ' + year + '년 · 옅을수록 오래된 해</small></h3>' + yearsSvg(item) + legendHtml() + yearsTable(item) +
      '<h3>올릴 때 · 내릴 때 <small>' + REF + '년 흐름 기준 · 영상 규칙(가정)</small></h3><dl>' +
      '<dt>올리기</dt><dd><b>' + up.text + '</b> — 제일 많이 찾는 달(' + ruleMonth(ref) + '월' + (ruleMonth(ref) !== ref.pm ? ' · ' + ref.pm + '월과 거의 같음' : '') + ') 3주 전' + (up.now ? '. 올릴 날은 지났고 아직 찾는 동안이라 지금' : '') + '. ' + REF + '년엔 <b>' + (startMonth(ref) ? startMonth(ref) + '월' : '연중') + '</b>부터 오르기 시작</dd>' +
      '<dt>내리기</dt><dd>' + (dropMonth(ref) ? '<b>' + dropMonth(ref) + '월 1일</b> — ' + REF + '년에 ' + dropMonth(ref) + '월부터 절반 아래로' : '모름 — 연중 절반 넘게 찾음') + '</dd></dl>' +
      privateBlock(item) + '</div>' : '');

  d.onkeydown = e => { if (e.target !== d) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };

}
function render() {

  const groups = { prep: [], peak: [], sell: [], rest: [] }, prof = new Map();

  groups.prep.sort((a, b) => prof.get(b.name).p - prof.get(a.name).p); groups.peak.sort((a, b) => prof.get(b.name).p - prof.get(a.name).p);
