* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0;

.months::-webkit-scrollbar { display: none; }
.mo { flex: 0 0 auto; width: 62px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px 4px 7px; text-align: center; scroll-snap-align: center; position: relative; }
.mo b { display: block; font-size: 20px; font-weight: 700; line-height: 1; }

.mo.fill { border-style: dashed; } .mo.fill .tag { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.mo[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mo[aria-pressed="true"] .jg, .mo[aria-pressed="true"] .cnt { color: inherit; opacity: .85; }

.help.on { display: block; } .help p { margin: 0 0 7px; } .help p:last-child { margin: 0; } .help b { font-weight: 600; }
.help i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
.head { padding: 16px 0 4px; }

.head .sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.notice { margin-top: 10px; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--soft); color: var(--ink); }
.notice b { font-weight: 600; }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 12px 0 6px; padding: 2px 0 3px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px 7px 10px; font-size: 13px; font-weight: 600; line-height: 1.2; color: var(--ink); white-space: nowrap; }
.tabs button i { width: 8px; height: 8px; border-radius: 50%; background: var(--rest); flex: 0 0 auto; }
.tabs button.key i, .tabs button.prep i { background: var(--prep); } .tabs button.peak i { background: var(--peak); } .tabs button.sell i { background: var(--sell); } .tabs button.rank i { background: var(--ink); }
.tabs button b { font-weight: 500; font-size: 12px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.tabs button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg); }
.how { font-size: 13px; color: var(--muted); margin: 8px 0 10px; } .how b { color: var(--ink); font-weight: 600; }

.list { display: grid; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px; min-width: 0; cursor: pointer; }
.card.open { border-color: var(--ink); }
.row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.name { font-size: 17px; font-weight: 700; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.chip.prep { background: var(--prep-soft); color: var(--prep); } .chip.peak { background: var(--peak-soft); color: var(--peak); } .chip.sell { background: var(--sell-soft); color: var(--sell); } .chip.rest { background: var(--rest-soft); color: var(--rest); }

.row .rank b { color: var(--ink); font-size: 14px; }
.mini, .bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; height: 36px; margin: 10px 0 0; }
.bars { height: 84px; }
.mini i, .bars i { display: block; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
.mini i.pk, .bars i.pk { background: var(--peak); }
.mini i.sel, .bars i.sel { background: var(--ink); }
.mini i.pk.sel, .bars i.pk.sel { background: var(--peak); box-shadow: inset 0 0 0 2px var(--ink); }

.season i { display: block; border-radius: 2px; background: var(--soft); } .season i.on { background: var(--sell); }

.key i.fill { opacity: .55; background-image: repeating-linear-gradient(135deg, transparent 0 2px, var(--panel) 2px 4px); }

svg.yrs .ln.sel { stroke: var(--peak); stroke-width: 2.6; opacity: 1; }
svg.yrs .dot { fill: var(--peak); } svg.yrs .dot.ring { fill: var(--panel); stroke: var(--peak); stroke-width: 2; }
